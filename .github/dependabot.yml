version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-deps:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/.github/actions/openai-agent"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/.github/pr-automation"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/.github/issue-automation"
    schedule:
      interval: "weekly"
