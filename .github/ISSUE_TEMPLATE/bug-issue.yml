name: '🐞 Report a bug or an issue'
description: Report issues or unexpected behaviors.
title: "[BUG] (Enter your description here)"
labels: ["bug"]
body:
  - type: checkboxes
    attributes:
      label: Please confirm these before moving forward
      description: Please confirm the following before posting your issue.
      options:
        - label: I have searched for my issue and have not found a work-in-progress/duplicate/resolved issue.
          required: true
        - label: I have tested that this issue has not been fixed in the latest [(beta or stable) release](https://github.com/Devolutions/UniGetUI/releases/).
          required: true
        - label: I have checked the [FAQ](https://github.com/Devolutions/UniGetUI#frequently-asked-questions) section for solutions.
          required: true
        - label: This issue is about a bug (if it is not, please use the [correct template](https://github.com/Devolutions/UniGetUI/issues/new/choose)).
          required: true
  - type: input
    attributes:
      label: UniGetUI Version
      placeholder: 'e.g., 2026.3.2 or 3.3.7'
    validations:
      required: true
  - type: input
    attributes:
      label: Operating system, version, and architecture
      description: Include Windows, Linux distribution, or macOS version and CPU architecture (x64 or ARM64).
      placeholder: Windows 11 Pro 24H2 x64 / Ubuntu 24.04 x64 / macOS 15.3 ARM64
    validations:
      required: true
  - type: input
    attributes:
      label: Installation source / channel
      description: Optional. How was UniGetUI installed (e.g., GitHub installer, WinGet, Scoop, Chocolatey, Microsoft Store, Flatpak, AppImage, DEB/RPM, macOS DMG/Homebrew)?
      placeholder: GitHub installer / WinGet / Flatpak / Homebrew
    validations:
      required: false
  - type: input
    attributes:
      label: Affected package manager or backend
      description: Optional. Which package manager or backend is involved (e.g., WinGet COM API, Bundled WinGet / Pinget, Scoop, Chocolatey, Pip, npm, Cargo, Apt, Flatpak, Homebrew)?
      placeholder: WinGet (COM API) / Scoop / Pip / UI only
    validations:
      required: false
  - type: textarea
    attributes:
      label: Describe your issue
      placeholder: Explain the issue you are experiencing, providing as many details as possible.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce the issue
      placeholder: How can this issue be reproduced? List here, if known, the steps followed before this issue appeared.
    validations:
      required: false
  - type: textarea
    attributes:
      label: UniGetUI Log
      render: "text"
      placeholder: Paste your UniGetUI logs here. Click the button on the bottom-left corner of UniGetUI -> UniGetUI Log.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Package Managers Logs
      description: Required when reporting a package discovery, install, update, uninstall, or source error. Include the exact command line executed by UniGetUI.
      render: "text"
      placeholder: Paste your Package Manager logs here. Click the button on the bottom-left corner of UniGetUI -> Package Manager logs.
    validations:
      required: false
  - type: textarea
    attributes:
      label: Relevant information
      placeholder: Other relevant information about this issue. Perhaps you have some special settings enabled or any other detail that could be related.
    validations:
      required: false
  - type: textarea
    attributes:
      label: Screenshots and videos
      placeholder: If applicable, please post here a video or a screenshot of the issue.
    validations:
      required: false
