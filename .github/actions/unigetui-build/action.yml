name: UniGetUI build
description: >
  Builds an unsigned UniGetUI installer from the checked-out source with scripts/build.ps1,
  the same way a local build does. Pass its installer-path output to the unigetui-desktop
  action. Needs the repository checked out in the workspace.

inputs:
  output-dir:
    description: Where build.ps1 puts the installer and zip; defaults to a folder in RUNNER_TEMP
    default: ''

outputs:
  installer-path:
    description: Path to UniGetUI.Installer.x64.exe
    value: ${{ steps.build.outputs.installer-path }}

runs:
  using: composite
  steps:
    - name: Install .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    # Same key as build-release.yml, so a build can reuse that workflow's packages.
    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', 'src/**/*.csproj', 'src/**/*.props', 'src/**/*.targets', 'src/**/*.sln', 'src/**/*.slnx') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Install Inno Setup
      shell: pwsh
      run: |
        choco install innosetup -y --no-progress
        if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed with exit code $LASTEXITCODE" }

    - name: Build UniGetUI installer
      id: build
      shell: pwsh
      # NuGet's cache folders (NUGET_PACKAGES, NUGET_HTTP_CACHE_PATH) come from the calling
      # workflow's env.
      env:
        OUTPUT_DIR: ${{ inputs.output-dir }}
        # MSBuild reads environment variables as properties. As in build-release.yml, build
        # project references one at a time without the shared compiler server: parallel
        # builds can race on the same output file on CI runners (CS2012).
        UseSharedCompilation: 'false'
        BuildInParallel: 'false'
      run: |
        $outputDir = $env:OUTPUT_DIR
        if ([string]::IsNullOrWhiteSpace($outputDir)) {
          $outputDir = Join-Path $env:RUNNER_TEMP 'unigetui-build'
        }

        # One retry, which is incremental, for the file-lock race above.
        try {
          & "$env:GITHUB_WORKSPACE\scripts\build.ps1" -SkipTests -OutputPath $outputDir
        }
        catch {
          Write-Host "::warning::scripts/build.ps1 failed ($($_.Exception.Message)); retrying once"
          & "$env:GITHUB_WORKSPACE\scripts\build.ps1" -SkipTests -OutputPath $outputDir
        }

        # build.ps1 only warns when it can't find ISCC, so check the installer was produced.
        $installerPath = Join-Path $outputDir 'UniGetUI.Installer.x64.exe'
        if (-not (Test-Path -LiteralPath $installerPath -PathType Leaf)) {
          throw "scripts/build.ps1 did not produce $installerPath"
        }
        "installer-path=$installerPath" >> $env:GITHUB_OUTPUT
